name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag churn-assignment1-api:${{ github.sha }}

      - name: Run Docker container
        run: |
          docker run -d \
            --name churn-api-test \
            -p 8000:8000 \
            churn-assignment1-api:${{ github.sha }}

      - name: Wait for API
        run: sleep 5

      - name: Test API
        run: |
          curl --fail http://localhost:8000/docs

      - name: Test Prediction API
        run: |
          curl --fail -X POST \
          "http://localhost:8000/predict?tenure=12&monthly_charges=70&total_charges=840&contract_type=%22Month-to-month%22&internet_service=%22DSL%22&tech_support=%22No%22"

      - name: Stop container
        if: always()
        run: docker rm -f churn-api-test